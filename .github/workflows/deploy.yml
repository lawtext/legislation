
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ vars.VERSION }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      PATH_SITE: temp

    steps:
      - uses: actions/checkout@v7

      - name: Build website
        run: |
          if [[ -d $PATH_SITE ]]; then
            echo "Clean $PATH_SITE"
            rm -r $PATH_SITE
          fi
          mkdir -p $PATH_SITE
          INDEX="$PATH_SITE/index.md"

          cat > $PATH_SITE/_config.yml <<EOF
          title: 立法技术规范
          description: documents about legislation
          markdown: kramdown
          theme: minima
          EOF

          # Generate index.md
          cat > $INDEX <<EOF
          ---
          title: 立法技术规范
          layout: default
          ---

          EOF

          for f in *.md; do
            [ "$f" = "README.md" ] && continue
            [ "$f" = "index.md" ] && continue

            name="${f%.md}"
            echo "- [$name]($f)" >> $INDEX
            {
              echo "---"
              echo "title: $name"
              echo "layout: default"
              echo "---"
              echo ""
              cat "$f"
            } > "$PATH_SITE/$f"
          done

          cp -r images $PATH_SITE/

      - uses: actions/configure-pages@v6

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ${{ env.PATH_SITE }}
          destination: _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
