name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ vars.VERSION }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      PATH_SITE: temp
      PATH_DIST: _site

    steps:
      - uses: actions/checkout@v7

      - name: Checkout site
        uses: actions/checkout@v7
        with:
          ref: site
          path: ${{ env.PATH_SITE }}

      - name: Build website
        run: |
          bash $PATH_SITE/deploy.sh $PATH_SITE

      - uses: actions/configure-pages@v6

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ${{ env.PATH_SITE }}
          destination: ${{ env.DIST }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.DIST }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
